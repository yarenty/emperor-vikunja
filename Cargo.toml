[package]
name = "emperor-vikunja"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server for Vikunja: list, read, create and update tasks, comment, list projects; built on emperor-mcp"
license = "MIT OR Apache-2.0"
authors = ["yarenty <yarenty@gmail.com>"]
repository = "https://github.com/yarenty/emperor-vikunja"
homepage = "https://github.com/yarenty/emperor-vikunja"
documentation = "https://docs.rs/emperor-vikunja"
readme = "README.md"
keywords = ["mcp", "mcp-server", "vikunja", "tasks", "todo"]
categories = ["command-line-utilities", "web-programming::http-server"]

[lib]
name = "emperor_vikunja"
path = "src/lib.rs"

[[bin]]
name = "emperor-vikunja"
path = "src/main.rs"

[dependencies]
# switch to version = "0.2" once published
emperor-mcp = { git = "https://github.com/yarenty/emperor-mcp", branch = "chore/rmcp-3" }
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
html2text = "0.17"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8"
