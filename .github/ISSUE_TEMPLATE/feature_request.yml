name: Feature request
description: A tool argument, flag or behaviour you need
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task you want an assistant to do in Vikunja, in your own words.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
  - type: textarea
    id: idea
    attributes:
      label: Suggested change
      description: The server keeps six tools; a new argument on an existing tool is usually the better fit.
