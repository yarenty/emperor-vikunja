name: emperor-vikunja
type: server
about:
  title: Vikunja tasks
  description: List, read, create and update tasks, comment on them and list projects in a Vikunja instance.
  icon: /mcpicons/vikunja.svg
meta:
  category: productivity
  tags: [tasks, todo, vikunja, projects]
endpoint: http://127.0.0.1:8034/mcp
topology: forward-headers
headers:
  Authorization:
    template: "Bearer {token}"
    secret: true
    ui:
      label: Vikunja API token
      hint: Vikunja > Settings > API Tokens. Forwarded with every request, never stored by the server.
  X-Upstream-Url:
    template: "{url}"
    secret: false
    ui:
      label: Vikunja URL for this connection
      hint: Optional. Address of your Vikunja, e.g. https://vikunja.example.com (https, or http on localhost). Overrides the server's --base-url.
tools:
  - name: list_tasks
    description: List tasks (open by default) sorted by priority then due date; filter by project, label, done, due_before, search.
  - name: get_task
    description: Read one task with every field, its description as text and its comments.
  - name: create_task
    description: Create a task with a Markdown description, labels (created only with create_missing_labels), assignees by username, priority 0-5 and due date.
  - name: update_task
    description: Change title, description, done, priority, due date, labels or assignees of a task, or move it to another project.
  - name: comment
    description: Add a Markdown comment to a task.
  - name: list_projects
    description: List projects with parent and number of open tasks.
config:
  parameters:
    type: object
    properties:
      base_url:
        type: string
        ui:
          label: Vikunja URL
          hint: Default Vikunja instance, e.g. https://vikunja.example.com (flag --base-url or env VIKUNJA_URL). Optional over HTTP when clients send X-Upstream-Url.
      read_only:
        type: boolean
        default: false
        ui:
          label: Read-only
          hint: Serve only list_tasks, get_task and list_projects (flag --read-only).
      bind:
        type: string
        default: 127.0.0.1:8034
        ui:
          label: Listen address
          hint: Where the MCP server listens in HTTP mode (flag --bind).
test_tool:
  name: list_projects
  args: {}
